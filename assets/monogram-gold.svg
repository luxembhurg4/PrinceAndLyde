<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="L and P luxury gold foil monogram">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2DB"/>
      <stop offset="25%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#FFF8E7"/>
      <stop offset="75%" stop-color="#C59B48"/>
      <stop offset="100%" stop-color="#EAD191"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Crest Circles -->
  <g fill="none" stroke="url(#foilGrad)">
    <circle cx="200" cy="116" r="92" stroke-width="1.2" opacity="0.6"/>
    <circle cx="200" cy="116" r="86" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="200" cy="116" r="80" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.85"/>
  </g>

  <!-- Botanical Laurel Wreath Leaves (Left & Right) -->
  <g fill="url(#foilGrad)" opacity="0.92">
    <!-- Left Wreath -->
    <path d="M125 116c4-12 12-22 22-30-2 8-1 18 4 24-9-1-18 2-26 6z"/>
    <path d="M132 86c7-11 16-19 28-23-4 8-4 17 0 24-8-3-18-2-28-1z"/>
    <path d="M149 60c10-8 21-14 34-15-6 7-7 16-4 23-8-4-18-5-30-8z"/>
    <path d="M125 124c4 12 12 22 22 30-2-8-1-18 4-24-9 1-18-2-26-6z"/>
    <path d="M132 154c7 11 16 19 28 23-4-8-4-17 0-24-8 3-18 2-28 1z"/>
    <path d="M149 180c10 8 21 14 34 15-6-7-7-16-4-23-8 4-18 5-30 8z"/>

    <!-- Right Wreath -->
    <path d="M275 116c-4-12-12-22-22-30 2 8 1 18-4 24 9-1 18 2 26 6z"/>
    <path d="M268 86c-7-11-16-19-28-23 4 8 4 17 0 24 8-3 18-2 28-1z"/>
    <path d="M251 60c-10-8-21-14-34-15 6 7 7 16 4 23 8-4 18-5 30-8z"/>
    <path d="M275 124c-4 12-12 22-22 30 2-8 1-18-4-24 9 1 18-2 26-6z"/>
    <path d="M268 154c-7 11-16 19-28 23 4-8 4-17 0-24 8 3 18 2 28 1z"/>
    <path d="M251 180c-10 8-21 14-34 15 6-7 7-16 4-23 8 4 18 5 30 8z"/>
  </g>

  <!-- Crown Flourish at Top -->
  <path d="M194 22l6-9 6 9 9-4-4 10h-22l-4-10z" fill="url(#foilGrad)"/>

  <!-- Monogram Initials with Refined Roman Typography -->
  <text x="200" y="132" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="54" font-weight="400" font-style="italic" fill="url(#foilGrad)" letter-spacing="4">L &amp; P</text>

  <!-- Bottom Ribbon Knot Accent -->
  <path d="M200 204l6 7-6 7-6-7z" fill="url(#foilGrad)"/>
  <circle cx="186" cy="211" r="2" fill="url(#foilGrad)"/>
  <circle cx="214" cy="211" r="2" fill="url(#foilGrad)"/>
</svg>
